name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Bump version (local, not yet pushed)
        run: |
          V="$(grep '^version=' gradle.properties | cut -d= -f2)"
          IFS='.' read -r MAJ MIN PATCH <<< "$V"
          PATCH=$((PATCH + 1))
          if [ "$PATCH" -gt 10 ]; then PATCH=0; MIN=$((MIN + 1)); fi
          if [ "$MIN" -gt 10 ]; then MIN=0; MAJ=$((MAJ + 1)); fi
          NEWV="${MAJ}.${MIN}.${PATCH}"
          sed -i "s/^version=.*/version=${NEWV}/" gradle.properties
          echo "NEW_VERSION=${NEWV}" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Bump version to ${NEWV} [skip ci]" || true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build mod
        run: gradle build --no-daemon --scan

      - name: List build outputs
        run: ls -la build/libs/

      - name: Push version bump (only if build succeeded)
        run: git push

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${NEW_VERSION:-$(grep '^version=' gradle.properties | cut -d= -f2)}"
          TAG="v${VERSION}"
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            --title "Custom Server Mod v${VERSION}" \
            --notes "Automated build from GitHub Actions." \
            build/libs/*.jar