name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Gradle wrapper with correct version
        run: |
          if [ ! -f ./gradlew ]; then
            curl -s https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradlew -o gradlew
            curl -s https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties 2>/dev/null || mkdir -p gradle/wrapper
            chmod +x gradlew
          fi
        shell: bash

      - name: Build mod with Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          arguments: build

      - name: List build outputs
        run: ls -la build/libs/

      - name: Create Release
        id: create_release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          TAG="v${VERSION}"
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            --title "Custom Server Mod v${VERSION}" \
            --notes "Automated build from GitHub Actions." \
            build/libs/*.jar
